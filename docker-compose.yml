services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auca_library_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auca_library_db"]
      interval: 5s
      timeout: 5s
      retries: 10
